name: Sourceforge Download and Extract WinSSL3

on: [push, pull_request]

jobs:
  download_extract:
    name: Sourceforge-Download-and-Extract-WinSSL3
    runs-on: windows-latest
    steps:

    - name: Cache WinSSL3 for Test on PostgreSQL for Windows
      # if: ${{ ( env.os == 'windows-2025-vs2026' && env.compilerClass == 'Mingw' && env.WinSSL3 == 'true' ) }}
      uses: actions/cache@v5
      id: cacheWinSSL3Zip
      with:
        path: openssl-3.6.2.zip
        key:  openssl-3.6.2.zip
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1

    - name: Download WinSSL3 for Test on PostgreSQL for Windows
      if: ${{ steps.cacheWinSSL3Zip.outputs.cache-hit != 'true' }}
      # if: ${{ ( ( env.os == 'windows-2025-vs2026' && env.compilerClass == 'Mingw' && env.WinSSL3 == 'true' ) ) &&
      #   steps.cacheWinSSL3Zip.outputs.cache-hit != 'true'
      #   }}
      uses: suisei-cn/actions-download-file@v1.6.1
      id: downloadWinSSL3Zip
      with:
        retry-times: 1
        # verified NOV 20 2026
        # last file update 2026-05-03
        # url from Google Chrome triple verticle dots Download page
        url: https://psychz.dl.sourceforge.net/project/openssl/openssl-3.6.2-x64/openssl-3.6.2.zip?viasf=1&fid=78c6a18ebfd9607f&e=1795230732&st=ZVbNUVCS0gFL-koE9NOjhg

    # Install WinSSL3
    - name: Extract WinSSL3Zip and add WinSSL3Zip bin and lib directories to the PATH for Test on PostgreSQL for Windows
      # if: ${{ ( env.os == 'windows-2025-vs2026' && env.compilerClass == 'Mingw' && env.WinSSL3 == 'true' ) }}
      shell: cmd
      run: |
        rem MKDIR creates any intermediate directories in the path, if needed.
        mkdir                                "C:\OTHERBIN\openssl-3"
        REM 7z is provided by Github Actions
        7z x  openssl-3.6.2.zip            -o"C:\OTHERBIN"
        REM copy  openssl-3.6.2.zip          "C:\OTHERBIN\openssl-3"
        dir                                  "C:\OTHERBIN\openssl-3"
        dir                                  "C:\OTHERBIN\openssl-3\bin"
        dir                                  "C:\OTHERBIN\openssl-3\lib"
        tree /f                              "C:\OTHERBIN\openssl-3"
        rem - man7.org/linux/man-pages/man1/printf.1.html
        printf                               "C:\\OTHERBIN\\openssl-3\\bin" >> %GITHUB_PATH%
        printf                               "C:\\OTHERBIN\\openssl-3\\lib" >> %GITHUB_PATH%








