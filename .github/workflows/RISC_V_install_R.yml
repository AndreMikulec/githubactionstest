name: riscv64
run-name: riscv64 - ${{ github.event.head_commit.message }}

on: 
   push:
   pull_request: 
   workflow_dispatch:

jobs:

  job_master_ubuntu-24_04-riscv:
    name: PG master ubuntu-24.04-riscv
    runs-on: ubuntu-24.04-riscv
    steps:
      - name: Echo site details
        run: echo building master
 
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout
        run: |
          set -x -v -e

          export DEBIAN_FRONTEND=noninteractive

          # cat /etc/apt/sources.list
