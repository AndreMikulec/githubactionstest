
name: riscv64
run-name: riscv64 - ${{ github.event.head_commit.message }}

on: 
   push:
   pull_request: 
   workflow_dispatch:

jobs:

  job_master_ubuntu-24_04-riscv:
    name: PG master ubuntu-24.04-riscv
    runs-on: ubuntu-24.04-riscv
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:

      - name: Download This Repository Code
        uses: actions/checkout@v6
 
      - name: Update and Upgrade
        run: |
          set -x -v -e
          uname -a
          
          sudo apt update
          sudo apt-get upgrade -y

      - name: Install the repository R packages
        run: |
          set -x -v -e
          sudo apt-get install -qq r-base r-base-dev -y
          sudo apt-get install -qq --without-recommended-packages --without-x --without-ICU --without-cairo --without-libtiff --without-readline  build-essential ca-certificates curl gcc gfortran libblas-dev libbz2-dev libjpeg-turbo8-dev libjpeg8-dev liblapack-dev liblzma-dev libncurses-dev libpcre2-dev libpng-dev libreadline-dev libjpeg-dev  -y
          sudo apt-get install -qq subversion -y

      - name: Acquire R Source
        run: |
          set -x -v -e
          # r-devel
          svn checkout https://svn.r-project.org/R/trunk/ r-src

      - name: Configure R
        run: |
          set -x -v -e
          pushd r-src
          ./configure --help
          ./configure --enable-R-shlib --disable-java --disable-byte-compiled-packages --disable-rpath --without-ICU --without-recommended-packages
          popd

      - name: Make R
        run: |
          set -x -v -e
          pushd r-src
          make
          popd

      - name: Install R
        run: |
          set -x -v -e
          pushd r-src
          sudo make install
          popd

      - name: Test R
        run: |
          set -x -v -e
          export PATH=/usr/local/bin:$PATH
          R --version


