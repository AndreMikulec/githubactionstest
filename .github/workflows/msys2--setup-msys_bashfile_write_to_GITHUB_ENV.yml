name: bashfile_write_to_GITHUB_ENV name
run-name: bashfile_write_to_GITHUB_ENV run-name

on:
   push:
   pull_request:
   workflow_dispatch:

env:
  BUILD_GREETING: "BUILD_GREETING Hello"

jobs:
  job1: 
    name: job1 ${{ matrix.os }} ${{ matrix.compilerEnv }}
    env:
      JOB_GREETING: "JOB_GREETING Hello"
    runs-on: ${{ matrix.os }}
    outputs:
      GREETING_OUTPUT_BETWEEN_JOBS: ${{ steps.job1_Run_Step_1.outputs.GREETING_OUTPUT_BETWEEN_JOBS }}
    strategy:
      fail-fast: false
      matrix:
        include:

        - os: windows-2025-vs2026
          compilerEnv: UCRT64
          shellEnv: msys2 {0}

#       - os: windows-2022
#         compilerEnv: UCRT64
#         shellEnv: msys2 {0}

    defaults:
      run:
        shell: ${{ matrix.shellEnv || 'bash' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: job1 Install ${{ matrix.os }} ${{ matrix.compilerEnv }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.compilerEnv }}
        path-type: strict

    - name: job1 Run Step 1 ${{ matrix.os }} ${{ matrix.compilerEnv }}
      id: job1_Run_Step_1
      env:
        msystem: ${{ matrix.compilerEnv }}
      run: |
        set -x -v -e
        echo "job1 Run MSYS2 1"
        
        echo "BUILD_GREETING: ${BUILD_GREETING}"
        echo "JOB_GREETING: ${JOB_GREETING}"
        # set it
        export GREETING_FROM_CALLING_SHELL="GREETING_FROM_CALLING_SHELL Hello"
        $(cygpath ${GITHUB_WORKSPACE})/bashfile_write_to_GITHUB_ENV.sh
        # receive it
        echo "GREETING_FROM_CHILD_SHELL: ${GREETING_FROM_CHILD_SHELL}" # no value returned
        echo "env GREETING: ${{ env.GREETING }}"                       # no value returned
        echo "GREETING: ${GREETING}"                                   # no value returned
        export JOB_GREETING="${JOB_GREETING} from previous step"
        export BUILD_GREETING="${BUILD_GREETING} from previous step"

    - name: job1 Run Step 2 ${{ matrix.os }} ${{ matrix.compilerEnv }}
      id: job1_Run_MSYS2_2
      env:
        msystem: ${{ matrix.compilerEnv }}
        GREETING: ${{ env.GREETING }}
        GREETING_OUTPUT: ${{ steps.job1_Run_Step_1.outputs.GREETING_OUTPUT }}
      run: |
        set -x -v -e
        echo "job1 Run MSYS2 2"
        echo "GREETING: ${GREETING}"
        echo "GREETING_OUTPUT: ${GREETING_OUTPUT}"
        echo "JOB_GREETING: ${JOB_GREETING}"                         # no change from "changed export" of previous step"
        echo "BUILD_GREETING: ${BUILD_GREETING}"                     # no change from "changed export" of previous step"
        export BUILD_GREETING="${BUILD_GREETING} from previous job"

  job2:
    name: job2 ${{ matrix.os }} ${{ matrix.compilerEnv }}
    needs: job1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:

        - os: windows-2025-vs2026
          compilerEnv: UCRT64
          shellEnv: msys2 {0}

#       - os: windows-2022
#         compilerEnv: UCRT64
#         shellEnv: msys2 {0}

    defaults:
      run:
        shell: ${{ matrix.shellEnv || 'bash' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: job2 Install ${{ matrix.os }} ${{ matrix.compilerEnv }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.compilerEnv }}
        path-type: strict

    - name: job2 Run Step 1 ${{ matrix.os }} ${{ matrix.compilerEnv }}
      id: job2_Run_MSYS2_1
      env:
        msystem: ${{ matrix.compilerEnv }}
        GREETING_OUTPUT_BETWEEN_JOBS: ${{ needs.job1.outputs.GREETING_OUTPUT_BETWEEN_JOBS }}
      run: |
        set -x -v -e
        echo "job2 Run MSYS2 1"
        echo "GREETING_OUTPUT_BETWEEN_JOBS ${GREETING_OUTPUT_BETWEEN_JOBS}"
        echo "BUILD_GREETING: ${BUILD_GREETING}"                    # no change from "changed export" of previous job"
