

name: Builds
run-name: Builds - ${{ github.event.head_commit.message }}

on:
  push:
  workflow_dispatch:

jobs:

  build:
    name: >-
      matid ${{ matrix.matid }} ${{ matrix.compilerEnv }} ${{ matrix.platform }} ${{ matrix.os }}
    needs: setup
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.GithubActionsIgnoreFail }}
    strategy:
      fail-fast: false
      matrix:
        include:

        - matid: '01'
          os: ubuntu-latest
          platform: linux
          compilerEnv: linux
          GithubActionsIgnoreFail: false

        - matid: '02'
          os: windows-2025-vs2026
          platform: windows-cygwin
          compilerEnv: cygwin
          GithubActionsIgnoreFail: false

    defaults:
      run:
        shell: ${{ matrix.shellEnv || 'bash' }}

    steps:

    - name: Pre-build check
      id: build_check
      shell: bash
      run: |
        echo "BEGIN Pre-build check"
        set -x -v -e
        echo "Preparing environment..."


    - name: Skip This Matrix Item matid ${{ matrix.matid }}
      shell: bash                     # redundant, because it is my defined matrix default
      run: |
        set -x -v -e
        echo "Hello"

    - name: Checkout
      uses: actions/checkout@v6


    - name: Windows Machine Stats for $${{ matrix.os }}
      if: ${{ matrix.os == 'windows-2025-vs2026'  }}
      shell: cmd
      run: |
        systeminfo


