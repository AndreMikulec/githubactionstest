name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable debug mode'
        required: false
        default: false

jobs:
  build:
    name: Job Start
    continue-on-error: ${{ matrix.GithubActionsIgnoreFail }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - matid: '02'
            os: windows-2025-vs2026
            GithubActionsIgnoreFail: false
            compilerEnv: UCRT64
            compilerClass: MSYS2
            shellEnv: msys2 {0}

    defaults:
      run:
        shell: ${{ matrix.shellEnv || 'bash' }}

    steps:

      # REQUIRED for any debug session MAYBE
    - name: Git Checkout this Repository Code
      uses: actions/checkout@v6

    - name: Environments Setup
      env:
        shell: bash
      run: |
        set -x -v -e
        export compilerEnv="${{ matrix.compilerEnv }}"
        echo "compilerEnv: ${compilerEnv}"
        echo "compilerEnv=${compilerEnv}" >> ${GITHUB_ENV}
        export compilerClass="${{ matrix.compilerClass }}"
        echo "compilerClass: ${compilerClass}"
        echo "compilerClass=${compilerClass}" >> ${GITHUB_ENV}

    - name: Install Windows mingw Software
      if: ${{ matrix.os == 'windows-2025-vs2026' }}
      uses: msys2/setup-msys2@v2
      with:
        path-type: strict
        msystem: ${{ env.compilerEnv }}

    - name: Msys Run Something
      # if: ${{ matrix.os == 'windows-2025-vs2026' }}
      env:
        msystem: ${{ env.compilerEnv  }} # useless on ubuntu-latest
      run: |
        set -x -v -e
        echo "Hello" >  Hello.txt
        echo "GREETING=Hello" >> ${GITHUB_ENV}
        echo "github.run_attempt: ${{ github.run_attempt }}"

#   - name: Setup upterm session
#     uses: owenthereal/action-upterm@v1
#     with:
#       wait-timeout-minutes: 1
#       limit-access-to-actor: true
#       limit-access-to-users: AndreMikulec

      # very good - but does not have SFTP access "mxschmitt/action-tmate" DOES HAVE SFTP
      # Warning: Unexpected input(s) 'timeout-minutes', 
      # valid inputs are [
      #   'sudo', 'install-dependencies', 'limit-access-to-actor', 
      #   'detached', 'connect-timeout-seconds', 
      #   'tmate-server-host', 
      #   'tmate-server-port', 
      #   'tmate-server-rsa-fingerprint', 'tmate-server-ed25519-fingerprint', 
      #   'msys2-location', 'github-token']
    - name: Debug with SSH
      if: ${{ inputs.debug_enabled == true || '1' == '1' || github.run_attempt > 1 }}
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        connect-timeout-seconds: 1

    - name: Msys Run Something More
      # if: ${{ matrix.os == 'windows-2025-vs2026' }}
      env:
        msystem: ${{ env.compilerEnv }}  # useless on ubuntu-latest
      run: |
        set -x -v -e
        echo "Hello" >  Hello.txt
        echo " There" >>  Hello.txt
        cat Hello.txt

