name: CI

on:
  # Then go to Actions -> your workflow -> Run workflow, check debug_enabled
  #   and start it.
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable debug mode'
        required: false
        default: false

jobs:
  build:
    name: Job Start
    continue-on-error: ${{ matrix.GithubActionsIgnoreFail }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - matid: '02'
            os: windows-2025-vs2026
            GithubActionsIgnoreFail: false
            compilerEnv: UCRT64
            shellEnv: msys2 {0}

    defaults:
      run:
        shell: ${{ matrix.shellEnv || 'bash' }}

    steps:

    - name: Git Checkout this Repository Code
      uses: actions/checkout@v6

    - name: Install Windows mingw Software
      if: ${{ matrix.os == 'windows-2025-vs2026' }}
      uses: msys2/setup-msys2@v2
      with:
        path-type: strict
        msystem: ${{ matrix.compilerEnv }}
        install: >-
          tmux

    - name: Msys Run Something
      if: ${{ matrix.os == 'windows-2025-vs2026' }}
      env:
        msystem: ${{ env.compilerEnv }}
      run: |
        set -x -v -e
        echo "Hello" >  Hello.txt
        echo github.event_name: ${{ github.event_name }}
        echo inputs.debug_enabled: ${{ inputs.debug_enabled }}

#   - name: Setup upterm session
#     uses: owenthereal/action-upterm@v1
#     with:
#       wait-timeout-minutes: 1
#       limit-access-to-actor: true
#       limit-access-to-users: AndreMikulec

    - name: Debug with SSH
      if: ${{ inputs.debug_enabled == true }}
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        timeout-minutes: 1

    - name: Msys Run Something More
      if: ${{ matrix.os == 'windows-2025-vs2026' }}
      env:
        msystem: ${{ env.compilerEnv }}
      run: |
        set -x -v -e
        echo "Hello" >  Hello.txt
        echo " There" >>  Hello.txt
        cat Hello.txt

