name: Builds
run-name: Builds

permissions:
  contents: write

on:
   push:
   pull_request:
   workflow_dispatch:

jobs:
  build:
    name: matid ${{ matrix.matid }} 
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.GithubActionsIgnoreFail }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - matid: '02'
            os: windows-2025-vs2026
            GithubActionsIgnoreFail: false
            compilerEnv: UCRT64
            shellEnv: msys2 {0}

    steps:

    - name: Environments Setup
      env:
        shell: bash
      run: |
        set -x -v -e
        export compilerEnv="${{ matrix.compilerEnv }}"
        echo "compilerEnv: ${compilerEnv}"
        echo "compilerEnv=${compilerEnv}" >> ${GITHUB_ENV}
        export compilerClass="${{ matrix.compilerClass }}"
        echo "compilerClass: ${compilerClass}"
        echo "compilerClass=${compilerClass}" >> ${GITHUB_ENV}

    - name: Install Windows mingw Software
      if: ${{ env.osClass == 'windows' && env.compilerClass == 'MSYS2' }}
      uses: msys2/setup-msys2@v2
      with: 
        update: true
        path-type: strict
        msystem: ${{ env.compilerEnv }}

    - name: Ops
      if: ${{ env.osClass == 'windows' && env.compilerClass == 'MSYS2' }}
      env:
        # Msys OS variable
        msystem: ${{ env.compilerEnv }}
      run: |
        echo "Ops"
        set -x -v -e
        echo "msystem: ${msystem}"

